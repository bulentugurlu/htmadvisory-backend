# Shared defaults across ALL environments.
# Environment-specific overrides live in application-{profile}.yml
# (e.g. application-dev.yml) and are activated via the SPRING_PROFILES_ACTIVE
# environment variable at deploy time — see "Environment Configuration
# Pattern" in CLAUDE.md.

spring:
  application:
    name: platform-backend

  # MongoDB connection details are environment-specific and intentionally
  # NOT set here — see application-dev.yml. Never put a real connection
  # string or credential in this shared file, since it is loaded in every
  # environment including production.

  # NOTE: spring.liquibase.* properties are intentionally NOT used here.
  # Spring Boot's built-in Liquibase auto-configuration requires a JDBC
  # DataSource, which does not exist in this MongoDB-only project — that
  # auto-configuration permanently refuses to activate regardless of these
  # properties. Liquibase changesets are run manually instead, via
  # org.htmadvisory.platform.shared.MongoLiquibaseRunner. See that class's
  # Javadoc for the full explanation.

  # PostgreSQL datasource for the audit domain.
  # Defaults allow local development without environment variables set.
  # Tests override these via DynamicPropertySource.
  datasource:
    url: ${POSTGRESQL_URL:jdbc:postgresql://localhost:5432/htmadvisory_dev}
    username: ${POSTGRESQL_USER:htmadvisory}
    password: ${POSTGRESQL_PASSWORD:localdevonly}
    driver-class-name: org.postgresql.Driver

  # Flyway is disabled by default — enabled per-environment (tests override
  # via DynamicPropertySource, dev profile sets it explicitly).
  flyway:
    enabled: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        # Only expose the health endpoint by default. Do not widen this to
        # "*" without deliberately deciding what's safe to expose in
        # non-dev environments.
        include: health
  endpoint:
    health:
      show-details: when-authorized

htm:
  jwt:
    # Same convention as spring.datasource.password above: a checked-in,
    # non-secret default so `mvn test` and local dev work with zero setup,
    # overridden by the real value (GCP Secret Manager, JWT_SECRET) in every
    # deployed environment. NEVER left as this default in prod — anyone with
    # this string can forge a valid session for any user, including ADMIN.
    # An empty/absent default was tried and rejected: it fails Spring context
    # startup, which breaks every @WebMvcTest slice (any test that pulls in
    # WebMvcConfig's interceptors) and the shared Testcontainers integration
    # context, not just auth's own tests.
    secret: ${JWT_SECRET:htm-advisory-default-insecure-jwt-secret-change-in-production-via-JWT_SECRET}
    # How long a login session stays valid before the member must log in again.
    expiration-hours: 168 # 7 days
  documents:
    # GCS bucket holding member-only documents — deliberately a SEPARATE
    # bucket from the public one (htmadvisory-whitepapers), not a "private/"
    # folder within it. GCS access control is bucket-scoped when uniform
    # bucket-level access is on (mandatory here via org policy), so a
    # folder prefix within one bucket cannot be locked down independently
    # of the rest of that bucket's contents.
    private-bucket: ${DOCUMENTS_PRIVATE_BUCKET:htmadvisory-whitepapers-private}
    # This backend's own public URL, used to build the download link
    # embedded in delivery emails. Must be set explicitly per environment —
    # a Cloud Run instance doesn't know its own external URL from inside
    # the running container.
    backend-base-url: ${DOCUMENTS_BACKEND_BASE_URL:http://localhost:8080}
    # How long a one-time download link stays valid after being requested.
    # Short on purpose — this is a bearer credential embedded in an email.
    download-token-expiration-minutes: 15

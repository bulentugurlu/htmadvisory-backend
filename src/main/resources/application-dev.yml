# Development environment overrides.
# Activated via: SPRING_PROFILES_ACTIVE=dev

spring:
  data:
    mongodb:
      # PLACEHOLDER — replace once the dev MongoDB Atlas cluster exists
      # (see CLAUDE.md build order: MongoDB connection comes after this
      # skeleton boots successfully). Never commit a real connection
      # string with embedded credentials — once a real cluster exists,
      # this should reference an environment variable instead, e.g.:
      #   uri: ${MONGODB_URI}
      uri: ${MONGODB_URI:mongodb://localhost:27018/htmadvisory_dev}

  datasource:
    url: ${POSTGRESQL_URL:jdbc:postgresql://localhost:5432/htmadvisory_dev}
    username: ${POSTGRESQL_USER:htmadvisory}
    password: ${POSTGRESQL_PASSWORD:localdevonly}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

management:
  endpoint:
    health:
      show-details: always
